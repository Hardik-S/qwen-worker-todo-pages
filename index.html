<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="hero">
        <p class="eyebrow">GitHub Pages demo</p>
        <h1 id="app-title">Simple Todo</h1>
        <p class="subtitle">Keep a small list that stays saved in this browser.</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label for="todo-input">New todo</label>
        <div class="form-row">
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="120"
            placeholder="Add something to do"
            required
          />
          <button type="submit">Add</button>
        </div>
      </form>

      <section class="toolbar" aria-live="polite">
        <p id="todo-count">No todos yet.</p>
        <button id="clear-completed" type="button">Clear completed</button>
      </section>

      <ul id="todo-list" class="todo-list" aria-label="Todo list"></ul>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
