<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen Worker Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app__header">
      <p class="eyebrow">Static GitHub Pages app</p>
      <h1 id="app-title">Todo List</h1>
      <p class="subtitle">Add tasks, mark them done, and keep your list in this browser.</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="visually-hidden" for="todo-input">New todo</label>
      <input
        id="todo-input"
        name="todo"
        type="text"
        placeholder="What needs to be done?"
        maxlength="140"
        required
      >
      <button type="submit">Add</button>
    </form>

    <section class="panel" aria-live="polite" aria-atomic="true">
      <div class="toolbar">
        <p id="todo-count" class="count">0 items remaining</p>
        <button id="clear-completed" class="secondary" type="button">Clear completed</button>
      </div>

      <p id="empty-state" class="empty-state">No todos yet. Add one above to get started.</p>
      <ul id="todo-list" class="todo-list" aria-label="Todo items"></ul>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
